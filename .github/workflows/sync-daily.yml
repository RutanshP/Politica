name: Politica daily sync

# Runs the data syncs on GitHub's servers (free, no per-job timeout) by calling
# the deployed Vercel app. Running the sync *on* Vercel keeps Vercel's cache
# fresh. Requires two repo secrets:
#   POLITICA_APP_URL     e.g. https://politica.vercel.app  (no trailing slash)
#   POLITICA_SYNC_SECRET same value as in Vercel's env
on:
  schedule:
    # ~10:23 UTC = ~3:23 AM Pacific. Deliberately off the top of the hour: GitHub
    # runs schedules best-effort and drops/delays many at :00 under load.
    - cron: "23 10 * * *"
  # Manual "Run workflow" button. The vote-refresh size is an input so a backfill can be cleared in
  # one go without editing the workflow: a parser change leaves every stored roll call needing a
  # re-fetch, and the nightly size is tuned for the steady-state rotation, not for catching up.
  workflow_dispatch:
    inputs:
      vote_refresh_chunks:
        description: "Vote-refresh chunks this run (25 roll calls each). 60 clears a full backlog."
        required: false
        default: ""
      amendment_chunks:
        description: "Amendment-link chunks this run (10 bills each). 20 clears a full backlog."
        required: false
        default: ""

concurrency:
  group: politica-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_URL: ${{ secrets.POLITICA_APP_URL }}
      SYNC_SECRET: ${{ secrets.POLITICA_SYNC_SECRET }}
      # FEC chunk size. Keep small so each call fits Vercel's function timeout
      # (Hobby = 60s). Raise on Vercel Pro (up to ~limit=40) for faster coverage.
      FEC_LIMIT: "8"
      # How many FEC chunks per run. 8 x 8 = ~64 members/day, rotating by
      # staleness — matches the previous nightly design; the initial full
      # backfill is already done.
      FEC_CHUNKS: "8"
      # How many bill pages to walk per run, most-recently-updated first. Congress
      # touches hundreds of bills a day, so a single limit=25 page never reaches
      # brand-new introductions (they sit below all the existing bills getting new
      # actions). 8 x 25 = top 200 updated bills/night keeps new bills flowing in.
      BILL_CHUNKS: "8"
      BILL_LIMIT: "25"
      # Re-fetches stored federal roll calls from the Clerk/LIS feeds, needed whenever a parser
      # starts reading a field it previously dropped -- votes.question and votes.description were
      # both backfilled this way. The endpoint returns the roll calls that most need it first
      # (question nulls-first, then oldest-synced), so a fixed offset walks the whole backlog
      # instead of re-fetching page one every night. 1,444 federal votes were pending when this was
      # added, so 12 x 25 clears it in about five nights and then settles into a staleness
      # rotation that keeps results and tallies current.
      VOTE_REFRESH_CHUNKS: ${{ github.event.inputs.vote_refresh_chunks || '12' }}
      VOTE_REFRESH_LIMIT: "25"
      # Labels amendment roll calls with the amendment they were on, and pulls each amendment's
      # legislative text. Paged by *bill*: one congress.gov request returns a bill's whole slate.
      #
      # Deliberately small. A bill costs one congress.gov call, one ~900KB Rules Committee page and
      # one PDF per amendment -- H.R. 8800 alone is ~21 requests. At 10 bills a chunk that is 210
      # requests inside the route's 300s budget and ~800 a night against two House servers, which
      # is neither safe for the timeout nor polite. 4 x 4 covers 16 bills a night and still clears
      # the backlog, since it only ever picks bills that still need labelling.
      AMENDMENT_CHUNKS: ${{ github.event.inputs.amendment_chunks || '4' }}
      AMENDMENT_LIMIT: "4"
      # Governors, one seventh of the states per night. OpenStates throttles to 10 requests a
      # minute, so all fifty in one call is five minutes against a 300s route budget. Splitting by
      # day of week needs no cursor and refreshes every state weekly, which is far more often than
      # governors change. The President and Vice President come from a single static file and run
      # every night alongside.
      GOV_MON: "al,ak,az,ar,ca,co,ct"
      GOV_TUE: "de,fl,ga,hi,id,il,in"
      GOV_WED: "ia,ks,ky,la,me,md,ma"
      GOV_THU: "mi,mn,ms,mo,mt,ne,nv"
      GOV_FRI: "nh,nj,nm,ny,nc,nd,oh"
      GOV_SAT: "ok,or,pa,ri,sc,sd,tn"
      GOV_SUN: "tx,ut,vt,va,wa,wv,wi,wy"
    steps:
      - name: Check secrets
        run: |
          test -n "$APP_URL" || { echo "::error::POLITICA_APP_URL secret is not set"; exit 1; }
          test -n "$SYNC_SECRET" || { echo "::error::POLITICA_SYNC_SECRET secret is not set"; exit 1; }

      - name: Run syncs
        run: |
          set -uo pipefail
          APP_URL="${APP_URL%/}"   # tolerate a trailing slash in the secret
          post() {
            path="$1"
            # -L follows redirects (a 308 preserves POST + body). num_redirects/
            # url_effective reveal *where* it went if a redirect is in the way
            # (e.g. -> vercel.com/sso means Deployment Protection is on).
            out=$(curl -sS -L --max-time 320 -o /tmp/resp \
              -w "%{http_code} redirects=%{num_redirects} final=%{url_effective}" \
              -X POST -H "Authorization: Bearer $SYNC_SECRET" "$APP_URL$path" 2>/dev/null || echo "000 redirects=? final=?")
            echo "POST $path -> $out"
            code="${out%% *}"
            head -c 300 /tmp/resp 2>/dev/null; echo
            # A single timed-out/failed chunk shouldn't abort the whole run.
            case "$code" in 2*) return 0 ;; *) echo "::warning::$path returned $code"; return 0 ;; esac
          }

          echo "== Federal roster (new/departed members) =="
          post "/api/internal/sync/politicians?limit=250"

          echo "== Recent bills + votes (page through most-recently-updated) =="
          off=0
          i=1
          while [ "$i" -le "$BILL_CHUNKS" ]; do
            post "/api/internal/sync/legislation?offset=$off&limit=$BILL_LIMIT&syncVotes=true"
            off=$((off + BILL_LIMIT))
            i=$((i + 1))
          done

          echo "== Refresh stored federal roll calls ($VOTE_REFRESH_CHUNKS x $VOTE_REFRESH_LIMIT) =="
          # listOffset stays 0 on purpose: the endpoint orders by what still needs refreshing, so
          # each chunk picks up where the last left off without anyone tracking a cursor.
          i=1
          while [ "$i" -le "$VOTE_REFRESH_CHUNKS" ]; do
            post "/api/internal/sync/legislation?refreshStoredVotes=1&listOffset=0&listLimit=$VOTE_REFRESH_LIMIT"
            i=$((i + 1))
          done

          echo "== Link amendment roll calls ($AMENDMENT_CHUNKS x $AMENDMENT_LIMIT bills) =="
          # Runs after the vote refresh: that populates votes.question, and this only considers
          # roll calls whose question is "On Agreeing to the Amendment".
          i=1
          while [ "$i" -le "$AMENDMENT_CHUNKS" ]; do
            post "/api/internal/sync/bill-amendments?limit=$AMENDMENT_LIMIT"
            i=$((i + 1))
          done

          echo "== Executive branch (President, VP + one seventh of the governors) =="
          case "$(date -u +%u)" in
            1) GOV_STATES="$GOV_MON" ;;
            2) GOV_STATES="$GOV_TUE" ;;
            3) GOV_STATES="$GOV_WED" ;;
            4) GOV_STATES="$GOV_THU" ;;
            5) GOV_STATES="$GOV_FRI" ;;
            6) GOV_STATES="$GOV_SAT" ;;
            *) GOV_STATES="$GOV_SUN" ;;
          esac
          echo "   states today: $GOV_STATES"
          post "/api/internal/sync/executive?states=$GOV_STATES"

          echo "== FEC funding rotation ($FEC_CHUNKS x limit=$FEC_LIMIT) =="
          i=1
          while [ "$i" -le "$FEC_CHUNKS" ]; do
            post "/api/internal/sync/fec-funding-graph?limit=$FEC_LIMIT"
            i=$((i + 1))
          done

          echo "== News =="
          post "/api/internal/sync/news"

          # Candidate filings move at FEC filing-deadline pace, not daily -- the elections page
          # allows 8 days of staleness before it flags (ELECTIONS_STALE_AFTER_HOURS). Mondays
          # keeps it comfortably fresh without paying the full roster scan every night.
          if [ "$(date -u +%u)" = "1" ]; then
            echo "== Election candidates (weekly) =="
            post "/api/internal/sync/election-candidates"
          else
            echo "== Skipping election candidates (only runs Mondays) =="
          fi

          # Derived data (issues/entities/search/analytics) changes slowly and each rebuild scans
          # the whole corpus, so rebuilding daily was the main Supabase egress drain. Run it weekly
          # (Sundays). One call now loads the corpus once and rebuilds all parts in sequence.
          if [ "$(date -u +%u)" = "7" ]; then
            echo "== Rebuild derived data (weekly) =="
            post "/api/internal/rebuild"
          else
            echo "== Skipping derived-data rebuild (only runs Sundays) =="
          fi

          echo "Daily sync complete."
